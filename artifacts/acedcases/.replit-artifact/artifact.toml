kind = "web"
previewPath = "/"
title = "AcedCases"
version = "1.0.0"
id = "artifacts/acedcases"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25129

[services.development]
run = "pnpm --filter @workspace/acedcases run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/acedcases", "run", "build" ]
publicDir = "artifacts/acedcases/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25129"
BASE_PATH = "/"
